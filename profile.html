<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Provider Profile - CampusConnect</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white font-sans antialiased min-h-screen pb-20 md:pb-0"
  >
    <!-- Navbar -->
    <nav
      class="bg-white/90 dark:bg-gray-900/90 backdrop-blur-md py-4 px-6 md:px-12 flex justify-between items-center sticky top-0 z-40 border-b border-gray-100 dark:border-gray-800 transition-colors duration-300"
    >
      <a href="/" class="flex items-center space-x-2">
        <div
          class="bg-orange-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shadow-sm"
        >
          C
        </div>
        <div
          class="text-xl font-bold tracking-tight text-gray-900 dark:text-white"
        >
          Campus<span class="text-orange-600">Connect</span>
        </div>
      </a>

      <div class="hidden md:flex items-center space-x-6">
        <a
          href="/"
          class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white font-medium transition text-sm"
          >Home</a
        >
      </div>

      <!-- User Profile & Auth (Desktop) -->
      <div class="hidden md:flex items-center space-x-4">
        <button
          id="themeToggleBtn"
          class="mr-2 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-500 dark:text-gray-300 transition-colors focus:outline-none"
        >
          <svg
            id="themeIconDark"
            class="w-5 h-5 hidden"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            ></path>
          </svg>
          <svg
            id="themeIconLight"
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            ></path>
          </svg>
        </button>
        <div id="authContainer">
          <button
            id="openModalBtn"
            class="bg-orange-600 text-white px-5 py-2.5 rounded-full font-semibold text-sm hover:bg-orange-700 transition shadow-sm"
          >
            Sign Up / Login
          </button>
        </div>

        <div id="profileContainer" class="hidden relative">
          <button
            id="profileBtn"
            class="flex items-center space-x-2 text-gray-700 hover:text-orange-600 focus:outline-none transition group"
          >
            <div
              class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center border border-gray-200 group-hover:border-orange-200 transition"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
            </div>
            <span class="text-sm font-semibold hidden lg:block" id="profileName"
              >Profile</span
            >
            <span id="profileBadgeDesktop" class="hidden">
              <svg
                class="w-4 h-4 text-green-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
            </span>
          </button>

          <div
            id="profileDropdown"
            class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-xl shadow-lg py-1 z-50"
          >
            <div
              class="px-4 py-3 border-b border-gray-100 dark:border-gray-800"
            >
              <p
                class="text-sm font-bold text-gray-900 dark:text-white break-words"
                id="dropdownName"
              >
                User
              </p>
              <p
                class="text-xs text-gray-500 dark:text-gray-400 break-all"
                id="dropdownEmail"
              >
                user@example.com
              </p>
            </div>

            <div id="dropdownLinksContainer"></div>
            <button
              id="logoutBtn"
              class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 dark:hover:bg-gray-800 transition"
            >
              Log out
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button
          id="mobileMenuBtn"
          class="text-gray-600 hover:text-gray-900 focus:outline-none p-2"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div
      id="mobileMenu"
      class="hidden md:hidden bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-b border-gray-100 dark:border-gray-800 px-6 py-4 fixed w-full z-30 shadow-lg mt-[73px] top-0 left-0 transition-colors duration-300"
    >
      <div class="flex flex-col space-y-4">
        <a
          href="/"
          class="mobile-link block text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white font-medium"
          >Home</a
        >
        <div id="authContainerMobile">
          <button
            id="openModalBtnMobile"
            class="bg-orange-600 text-white px-5 py-2.5 rounded-full font-semibold text-sm hover:bg-orange-700 transition shadow-sm w-full text-center"
          >
            Sign Up / Login
          </button>
        </div>

        <div id="profileContainerMobile" class="!hidden hidden">
          <div
            class="px-5 py-3 border border-gray-100 dark:border-gray-700 rounded-xl mb-2 bg-gray-50 dark:bg-gray-800 flex items-center justify-between"
          >
            <div class="flex items-center space-x-2">
              <div
                class="w-8 h-8 rounded-full bg-white dark:bg-gray-700 flex items-center justify-center border border-gray-200 dark:border-gray-600"
              >
                <svg
                  class="w-4 h-4 text-gray-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  ></path>
                </svg>
              </div>
              <div>
                <div
                  class="text-sm font-bold text-gray-900 dark:text-white flex items-center space-x-1"
                >
                  <span id="profileNameMobile">My Profile</span>
                  <span id="profileBadgeMobile" class="hidden">
                    <svg
                      class="w-3 h-3 text-green-500"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                      ></path>
                    </svg>
                  </span>
                </div>
                <div
                  class="text-xs text-gray-500 dark:text-gray-400"
                  id="profileEmailMobile"
                >
                  user@example.com
                </div>
              </div>
            </div>
          </div>

          <div id="mobileLinksContainer"></div>
          <button
            id="logoutBtnMobile"
            class="bg-red-50 text-red-600 px-5 py-2.5 rounded-full font-semibold text-sm hover:bg-red-100 transition shadow-sm w-full text-center flex items-center justify-center space-x-2"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              ></path>
            </svg>
            <span>Log Out</span>
          </button>
        </div>
      </div>
    </div>

    <!-- App Container (Dynamic injection) -->
    <div id="app" class="profile-page p-4 max-w-3xl mx-auto mt-4 md:mt-8">
      <!-- Loading Skeleton Shell -->
      <section
        class="profile-header bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6"
      >
        <div
          class="skeleton"
          style="width: 80px; height: 80px; border-radius: 50%"
        ></div>
        <div class="profile-info flex-1 w-full space-y-3 mt-2 md:mt-0">
          <div
            class="skeleton"
            style="height: 28px; width: 60%; max-width: 200px"
          ></div>
          <div
            class="skeleton"
            style="height: 20px; width: 80%; max-width: 300px"
          ></div>
          <div
            class="skeleton"
            style="
              height: 24px;
              width: 120px;
              border-radius: 999px;
              margin-top: 12px;
            "
          ></div>
        </div>
        <div
          class="skeleton w-full md:w-32"
          style="height: 44px; border-radius: 12px"
        ></div>
      </section>

      <div
        class="skeleton mt-6"
        style="height: 150px; border-radius: 16px"
      ></div>
      <div
        class="skeleton mt-6"
        style="height: 250px; border-radius: 16px"
      ></div>
    </div>

    <!-- Mobile Bottom Tab Bar -->
    <nav
      class="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex justify-around items-center pb-safe pt-2 px-2 z-50"
    >
      <button
        id="mobile-home"
        class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
      >
        <svg
          class="w-6 h-6 mb-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          ></path>
        </svg>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button
        id="mobile-search"
        class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
      >
        <svg
          class="w-6 h-6 mb-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
        <span class="text-[10px] font-medium">Search</span>
      </button>
      <button
        id="mobile-post"
        class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
      >
        <div
          class="bg-orange-600 text-white rounded-full p-1.5 -mt-4 shadow-lg border-4 border-white dark:border-gray-900"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
        </div>
        <span class="text-[10px] font-medium mt-0.5">Post</span>
      </button>
      <button
        id="mobile-requests"
        class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
      >
        <svg
          class="w-6 h-6 mb-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
          ></path>
        </svg>
        <span class="text-[10px] font-medium">Requests</span>
      </button>
      <button
        id="mobile-profile"
        class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
      >
        <svg
          class="w-6 h-6 mb-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <span class="text-[10px] font-medium">Profile</span>
      </button>
    </nav>

    <!-- Script -->
    <script type="module" src="/src/profile.ts"></script>
  </body>
</html>
